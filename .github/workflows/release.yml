name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: pulse-windows-x86_64.exe
            bin: target/release/pulse-ui.exe
            universal_mac: false
          - os: ubuntu-latest
            artifact: pulse-linux-x86_64
            bin: target/release/pulse-ui
            universal_mac: false
          - os: macos-latest
            artifact: pulse-macos-universal
            bin: target/universal-apple-darwin/release/pulse-ui
            universal_mac: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux UI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev

      - name: Run tests
        run: cargo test --workspace

      - name: Build release binary
        if: ${{ !matrix.universal_mac }}
        run: cargo build --release -p pulse-ui

      - name: Build macOS Universal binary (arm64 + x86_64)
        if: ${{ matrix.universal_mac }}
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release -p pulse-ui --target aarch64-apple-darwin
          cargo build --release -p pulse-ui --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/pulse-ui \
            target/aarch64-apple-darwin/release/pulse-ui \
            target/x86_64-apple-darwin/release/pulse-ui

      - name: Stage artifact
        shell: bash
        run: cp "${{ matrix.bin }}" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
