[package]
name = "pulse-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
