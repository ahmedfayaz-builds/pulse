[package]
name = "pulse-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
pulse-core = { path = "../pulse-core" }
rfd = "0.15"
slint = "1.9"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "sync"] }
tokio-util = "0.7"

[build-dependencies]
slint-build = "1.9"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
